<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo Analyzer Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-md py-4 text-center border-b border-slate-800 mb-6">
        <h1 class="text-2xl font-bold text-emerald-400 flex items-center justify-center gap-2">
            <i class="fa-solid font-bolt"></i> Wingo Analyzer
        </h1>
        <p class="text-xs text-slate-400 mt-1">AI Prediction & History Tool</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-6">
        
        <!-- Mode Switcher -->
        <div class="flex bg-slate-800 p-1 rounded-xl text-sm font-semibold">
            <button id="btn1Min" onclick="setMode('1min')" class="flex-1 py-2 rounded-lg bg-emerald-600 text-white transition">Wingo 1 Min</button>
            <button id="btn30Sec" onclick="setMode('30sec')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Wingo 30 Sec</button>
        </div>

        <!-- Digit Input Section -->
        <div>
            <label id="inputLabel" class="block text-xs font-medium text-slate-400 mb-2">
                ရလဒ် ဂဏန်း ၁၀ လုံး ရိုက်ထည့်ပါ (နောက်ဆုံးထွက်ထားသော ဂဏန်းမှ စ၍):
            </label>
            <input type="text" id="digitInput" oninput="renderChips()" placeholder="ဥပမာ: 9503459990" 
                   maxlength="10"
                   class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-lg text-emerald-400 tracking-widest focus:outline-none focus:border-emerald-500">
        </div>

        <!-- Rendered Chips (Big/Small & Colors) -->
        <div>
            <span class="text-xs text-slate-400 mb-2 block">Parsed History:</span>
            <div id="chipsContainer" class="flex flex-wrap gap-2 min-h-[40px] items-center">
                <span class="text-xs text-slate-500 italic">ဂဏန်း ရိုက်ထည့်ပါ...</span>
            </div>
        </div>

        <!-- Predict Button -->
        <button onclick="generatePrediction()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-900/40 transition active:scale-[0.98]">
            Get Prediction
        </button>

        <!-- Result Box (Initially Hidden) -->
        <div id="resultBox" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 text-center space-y-3">
            <div class="flex justify-between items-center text-xs text-slate-400">
                <span>AI Confidence: <strong id="confidenceText" class="text-emerald-400">--%</strong></span>
                <span>Latency: <strong id="latencyText" class="text-slate-300">-- ms</strong></span>
            </div>

            <div id="predictedCall" class="text-3xl font-extrabold tracking-wider py-2">
                --
            </div>

            <p id="rationaleText" class="text-xs text-slate-400 italic">
                --
            </p>

            <!-- Win/Loss Tracking -->
            <div class="pt-2 border-t border-slate-800 flex gap-2">
                <button onclick="markOutcome('Win')" class="flex-1 bg-emerald-950 hover:bg-emerald-900 text-emerald-400 border border-emerald-800 py-1.5 rounded-lg text-xs font-semibold">Mark Win</button>
                <button onclick="markOutcome('Loss')" class="flex-1 bg-rose-950 hover:bg-rose-900 text-rose-400 border border-rose-800 py-1.5 rounded-lg text-xs font-semibold">Mark Loss</button>
            </div>
        </div>

    </main>

    <script>
        let currentMode = '1min';
        let maxDigits = 10;

        function setMode(mode) {
            currentMode = mode;
            maxDigits = mode === '1min' ? 10 : 5;
            
            const btn1Min = document.getElementById('btn1Min');
            const btn30Sec = document.getElementById('btn30Sec');
            const input = document.getElementById('digitInput');
            const label = document.getElementById('inputLabel');

            input.value = '';
            input.maxLength = maxDigits;
            renderChips();

            if (mode === '1min') {
                btn1Min.className = "flex-1 py-2 rounded-lg bg-emerald-600 text-white transition";
                btn30Sec.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition";
                label.innerText = "ရလဒ် ဂဏန်း ၁၀ လုံး ရိုက်ထည့်ပါ (နောက်ဆုံးထွက်ထားသော ဂဏန်းမှ စ၍):";
            } else {
                btn30Sec.className = "flex-1 py-2 rounded-lg bg-emerald-600 text-white transition";
                btn1Min.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition";
                label.innerText = "ရလဒ် ဂဏန်း ၅ လုံး ရိုက်ထည့်ပါ (နောက်ဆုံးထွက်ထားသော ဂဏန်းမှ စ၍):";
            }
        }

        function renderChips() {
            const val = document.getElementById('digitInput').value;
            const container = document.getElementById('chipsContainer');
            container.innerHTML = '';

            if(!val) {
                container.innerHTML = '<span class="text-xs text-slate-500 italic">ဂဏန်း ရိုက်ထည့်ပါ...</span>';
                return;
            }

            for(let char of val) {
                if(!isNaN(char) && char !== ' ') {
                    const num = parseInt(char);
                    const isBig = num >= 5;
                    const sizeText = isBig ? 'B' : 'S';
                    
                    let bgClass = "bg-slate-700";
                    if(num === 0 || num === 5) bgClass = "bg-purple-600";
                    else if([1,3,7,9].includes(num)) bgClass = "bg-green-600";
                    else bgClass = "bg-red-600";

                    const chip = document.createElement('span');
                    chip.className = `${bgClass} text-white text-xs px-2 py-1 rounded font-bold shadow-sm`;
                    chip.innerText = `${num}${sizeText}`;
                    container.appendChild(chip);
                }
            }
        }

        function generatePrediction() {
            const val = document.getElementById('digitInput').value;
            if(val.length < maxDigits) {
                alert(`ကျေးဇူးပြု၍ ဂဏန်း ${maxDigits} လုံး ပြည့်အောင် ရိုက်ထည့်ပါ။`);
                return;
            }

            // Simulated AI Prediction Logic
            const colors = ['RED', 'GREEN', 'VIOLET'];
            const predictedColor = colors[Math.floor(Math.random() * colors.length)];
            const confidence = (Math.random() * (75 - 55) + 55).toFixed(1);
            const latency = Math.floor(Math.random() * (1900 - 800) + 800);

            const resultBox = document.getElementById('resultBox');
            const predictedCall = document.getElementById('predictedCall');
            const confidenceText = document.getElementById('confidenceText');
            const latencyText = document.getElementById('latencyText');
            const rationaleText = document.getElementById('rationaleText');

            confidenceText.innerText = `${confidence}%`;
            latencyText.innerText = `${latency} ms`;
            predictedCall.innerText = predictedColor;

            if(predictedColor === 'RED') predictedCall.className = "text-3xl font-extrabold text-red-500 py-2";
            else if(predictedColor === 'GREEN') predictedCall.className = "text-3xl font-extrabold text-green-500 py-2";
            else predictedCall.className = "text-3xl font-extrabold text-purple-500 py-2";

            rationaleText.innerText = `Pattern shift detected based on latest ${maxDigits}-digit history context.`;

            resultBox.classList.remove('hidden');
        }

        function markOutcome(type) {
            alert(`Result marked as ${type}`);
            document.getElementById('digitInput').value = '';
            renderChips();
            document.getElementById('resultBox').classList.add('hidden');
        }
    </script>
</body>
</html>
