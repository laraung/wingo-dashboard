<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo Trend Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { flex: 1; padding: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-green { background: #22c55e; color: #fff; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-violet { background: #a855f7; color: #fff; }
        .card { background: #334155; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .prediction { font-size: 1.2rem; font-weight: bold; }
        .history { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        .dot { width: 24px; height: 24px; border-radius: 50%; display: inline-block; font-size: 10px; line-height: 24px; font-weight: bold; }
        .bg-green { background: #22c55e; }
        .bg-red { background: #ef4444; }
        .bg-violet { background: #a855f7; }
        .clear-btn { background: #64748b; color: white; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Wingo Trend Analyzer</h2>
    
    <p style="text-align:center; font-size: 0.9rem; color: #94a3b8;">ထွက်ထားသည့် အရောင်ကို အစဉ်လိုက် နှိပ်ပါ:</p>
    
    <div class="btn-group">
        <button class="btn-green" onclick="addResult('Green')">Green</button>
        <button class="btn-red" onclick="addResult('Red')">Red</button>
        <button class="btn-violet" onclick="addResult('Violet')">Violet</button>
    </div>

    <div class="card">
        <div>Trend Analysis / Next Predict:</div>
        <div id="prediction" class="prediction" style="color: #f87171;">Data မလုံလောက်သေးပါ (အနည်းဆုံး ၃ ခုထည့်ပါ)</div>
    </div>

    <div class="card">
        <div>ထည့်သွင်းထားသော History (နောက်ဆုံး ၁၀ ခု):</div>
        <div id="history" class="history"></div>
    </div>

    <button class="clear-btn" onclick="clearData()">Clear History</button>
</div>

<script>
    let history = JSON.parse(localStorage.getItem('wingo_history')) || [];

    function updateUI() {
        const historyDiv = document.getElementById('history');
        const predDiv = document.getElementById('prediction');
        
        // History Display
        historyDiv.innerHTML = '';
        history.slice(-10).forEach(item => {
            const dot = document.createElement('div');
            dot.className = `dot bg-${item.toLowerCase()}`;
            dot.innerText = item[0];
            historyDiv.appendChild(dot);
        });

        // Basic Pattern Logic Analysis
        if (history.length < 3) {
            predDiv.innerText = "Data မလုံလောက်သေးပါ (အနည်းဆုံး ၃ ခုထည့်ပါ)";
            predDiv.style.color = "#f87171";
            return;
        }

        const last3 = history.slice(-3).join('-');
        
        // Simple Probability Rules based on patterns
        if (history.slice(-1)[0] === 'Violet') {
            predDiv.innerText = "Next Trend: Green သို့မဟုတ် Red (Violet ပြီးနောက် Pattern ပြောင်းလေ့ရှိ)";
            predDiv.style.color = "#a855f7";
        } else if (history.slice(-2).every(val => val === history.slice(-1)[0])) {
            const sameColor = history.slice(-1)[0];
            predDiv.innerText = `Streak Trend: ${sameColor} ဆက်ထွက်နိုင်ခြေ သို့မဟုတ် Opposite ပြောင်းနိုင်ခြေ 50/50`;
            predDiv.style.color = sameColor === 'Green' ? '#4ade80' : '#f87171';
        } else {
            const lastColor = history.slice(-1)[0];
            const nextSuggested = lastColor === 'Green' ? 'Red' : 'Green';
            predDiv.innerText = `Suggested Trend: ${nextSuggested} (Alternating Pattern)`;
            predDiv.style.color = "#38bdf8";
        }
        
        localStorage.setItem('wingo_history', JSON.stringify(history));
    }

    function addResult(color) {
        history.push(color);
        updateUI();
    }

    function clearData() {
        history = [];
        localStorage.removeItem('wingo_history');
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
