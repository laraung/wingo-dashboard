<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wingo Smart Dynamic AI Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h2 { text-align: center; color: #38bdf8; margin: 0 0 15px 0; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        button { padding: 12px 5px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.1s, opacity 0.2s; color: #fff; font-size: 1.1rem; }
        button:active { transform: scale(0.95); }
        
        .btn-green { background: #22c55e; }
        .btn-red { background: #ef4444; }
        .btn-violet-red { background: linear-gradient(135deg, #a855f7 50%, #ef4444 50%); }
        .btn-violet-green { background: linear-gradient(135deg, #a855f7 50%, #22c55e 50%); }
        
        .card { background: #334155; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .card-title { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; display: flex; justify-content: space-between; }
        
        .pred-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .pred-item { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #475569; }
        .pred-value { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }
        .prob-text { font-size: 0.8rem; color: #38bdf8; margin-top: 4px; font-weight: 600; }

        .progress-bg { background: #0f172a; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 12px; }
        .progress-fill { background: linear-gradient(90deg, #38bdf8, #22c55e); height: 100%; width: 0%; transition: width 0.4s ease; }

        .history { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; margin-top: 10px; }
        .history-item { display: flex; flex-direction: column; align-items: center; background: #0f172a; padding: 6px 8px; border-radius: 6px; border: 1px solid #475569; }
        .dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; }
        .bs-text { font-size: 10px; margin-top: 4px; color: #cbd5e1; font-weight: bold; }
        
        .clear-btn { background: #64748b; color: white; width: 100%; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 Wingo Smart AI Dashboard</h2>
    
    <div class="card-title" style="justify-content: center;">ထွက်ထားသည့် ဂဏန်း (0-9) ကို နှိပ်ပါ:</div>
    <div class="num-grid">
        <button class="btn-violet-red" onclick="addResult(0)">0 (S)</button>
        <button class="btn-green" onclick="addResult(1)">1 (S)</button>
        <button class="btn-red" onclick="addResult(2)">2 (S)</button>
        <button class="btn-green" onclick="addResult(3)">3 (S)</button>
        <button class="btn-red" onclick="addResult(4)">4 (S)</button>
        <button class="btn-violet-green" onclick="addResult(5)">5 (B)</button>
        <button class="btn-red" onclick="addResult(6)">6 (B)</button>
        <button class="btn-green" onclick="addResult(7)">7 (B)</button>
        <button class="btn-red" onclick="addResult(8)">8 (B)</button>
        <button class="btn-green" onclick="addResult(9)">9 (B)</button>
    </div>

    <!-- AI Prediction Output Card -->
    <div class="card">
        <div class="card-title">
            <span>🧠 Dynamic Pattern Analytics</span>
            <span id="ai-status" style="color: #22c55e;">Active</span>
        </div>
        
        <div id="status-msg" style="color: #f87171; text-align: center; font-size: 0.9rem; padding: 10px 0;">Data မလုံလောက်သေးပါ (အနည်းဆုံး ၅ ခု ထည့်ပါ)</div>
        
        <div id="ai-output" style="display: none;">
            <div class="pred-box">
                <div class="pred-item">
                    <span style="font-size: 0.8rem; color: #94a3b8;">AI ခန့်မှန်း အရောင်</span>
                    <div id="pred-color" class="pred-value">-</div>
                    <div id="prob-color" class="prob-text">0% Probability</div>
                </div>
                <div class="pred-item">
                    <span style="font-size: 0.8rem; color: #94a3b8;">AI ခန့်မှန်း အရွယ်အစား</span>
                    <div id="pred-bs" class="pred-value">-</div>
                    <div id="prob-bs" class="prob-text">0% Probability</div>
                </div>
            </div>

            <div style="margin-top: 12px;">
                <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1;">
                    <span>AI Confidence Level:</span>
                    <span id="confidence-val">0%</span>
                </div>
                <div class="progress-bg">
                    <div id="confidence-bar" class="progress-fill"></div>
                </div>
            </div>

            <div id="pred-reason" style="font-size: 0.85rem; color: #38bdf8; margin-top: 12px; text-align: center; line-height: 1.4;"></div>
        </div>
    </div>

    <!-- History Card -->
    <div class="card">
        <div class="card-title">📜 History (နောက်ဆုံး ၁၅ ခု)</div>
        <div id="history" class="history"></div>
    </div>

    <button class="clear-btn" onclick="clearData()">Clear History</button>
</div>

<script>
    let history = JSON.parse(localStorage.getItem('wingo_dynamic_v1')) || [];

    function getItemDetails(num) {
        let color = '';
        if (num === 0) color = 'Violet-Red';
        else if (num === 5) color = 'Violet-Green';
        else if ([1, 3, 7, 9].includes(num)) color = 'Green';
        else color = 'Red';

        const bs = num >= 5 ? 'BIG' : 'SMALL';
        return { num, color, bs };
    }

    function updateUI() {
        const historyDiv = document.getElementById('history');
        const statusMsg = document.getElementById('status-msg');
        const aiOutput = document.getElementById('ai-output');
        
        const predColor = document.getElementById('pred-color');
        const probColor = document.getElementById('prob-color');
        const predBs = document.getElementById('pred-bs');
        const probBs = document.getElementById('prob-bs');
        const confidenceVal = document.getElementById('confidence-val');
        const confidenceBar = document.getElementById('confidence-bar');
        const predReason = document.getElementById('pred-reason');

        // History Render
        historyDiv.innerHTML = '';
        history.slice(-15).forEach(item => {
            const wrap = document.createElement('div');
            wrap.className = 'history-item';
            
            const dot = document.createElement('div');
            dot.className = 'dot';
            if (item.color === 'Green') dot.style.background = '#22c55e';
            else if (item.color === 'Red') dot.style.background = '#ef4444';
            else if (item.color === 'Violet-Red') dot.style.background = 'linear-gradient(135deg, #a855f7 50%, #ef4444 50%)';
            else if (item.color === 'Violet-Green') dot.style.background = 'linear-gradient(135deg, #a855f7 50%, #22c55e 50%)';
            dot.innerText = item.num;

            const bsLabel = document.createElement('span');
            bsLabel.className = 'bs-text';
            bsLabel.innerText = item.bs[0];

            wrap.appendChild(dot);
            wrap.appendChild(bsLabel);
            historyDiv.appendChild(wrap);
        });

        if (history.length < 5) {
            statusMsg.style.display = 'block';
            aiOutput.style.display = 'none';
            return;
        }

        statusMsg.style.display = 'none';
        aiOutput.style.display = 'block';

        const len = history.length;
        const lastBS = history.map(h => h.bs);
        const lastColors = history.map(h => h.color.includes('Green') ? 'GREEN' : h.color.includes('Red') ? 'RED' : 'VIOLET');

        // Check Streak Count
        let streakCount = 1;
        for (let i = len - 2; i >= 0; i--) {
            if (lastBS[i] === lastBS[len - 1]) streakCount++;
            else break;
        }

        let predictedBS = '';
        let bsProb = 50;
        let bsReason = '';

        // Dynamic Prediction Rules
        if (streakCount >= 4) {
            // တန်းရှည် ၄ ခါနှင့် အထက်ရောက်လျှင် Break ဖြစ်နိုင်ခြေ (ပြောင်းထွက်နိုင်ခြေ) ကို တွက်ချက်ခြင်း
            const oppositeBS = lastBS[len - 1] === 'BIG' ? 'SMALL' : 'BIG';
            predictedBS = oppositeBS;
            bsProb = Math.min(60 + (streakCount * 3), 85);
            bsReason = `⚠️ ${streakCount} ကြိမ် ဆက်တိုက် ${lastBS[len-1]} ထွက်ထားသဖြင့် Pattern အကေ့/အပြောင်း (${oppositeBS}) ကို သတိထားပါ။`;
        } else if (streakCount === 2 || streakCount === 3) {
            // ၂ ခါ သို့ ၃ ခါ ထွက်ထားချိန်တွင် Trend အတိုင်း ဆက်သွားနိုင်ခြေ ပိုများခြင်း
            predictedBS = lastBS[len - 1];
            bsProb = 65;
            bsReason = `📈 Trend အဟုန်အတိုင်း ${predictedBS} ဆက်လက်ထွက်နိုင်ခြေ ရှိပါသည်။`;
        } else if (lastBS[len-1] !== lastBS[len-2] && lastBS[len-2] !== lastBS[len-3]) {
            // Alternating Trend (တလှည့်စီ)
            predictedBS = lastBS[len-1] === 'BIG' ? 'SMALL' : 'BIG';
            bsProb = 70;
            bsReason = `🔄 Alternating Pattern (တလှည့်စီ) အရ ${predictedBS} ခန့်မှန်းထားသည်။`;
        } else {
            predictedBS = lastBS[len-1] === 'BIG' ? 'SMALL' : 'BIG';
            bsProb = 55;
            bsReason = `📊 Normal Trend balance အရ ${predictedBS} ဖြစ်နိုင်ခြေရှိသည်။`;
        }

        // Color Logic
        let predictedColor = lastColors[len-1] === 'GREEN' ? 'RED' : 'GREEN';
        let colorProb = 65;

        const confidence = Math.min(Math.round((bsProb + colorProb) / 1.5), 90);

        predColor.innerText = predictedColor;
        predColor.style.color = predictedColor === 'GREEN' ? '#4ade80' : '#f87171';
        probColor.innerText = `${colorProb}% Probability`;

        predBs.innerText = predictedBS;
        predBs.style.color = predictedBS === 'BIG' ? '#fbbf24' : '#38bdf8';
        probBs.innerText = `${bsProb}% Probability`;

        confidenceVal.innerText = `${confidence}%`;
        confidenceBar.style.width = `${confidence}%`;

        predReason.innerText = `💡 ${bsReason}`;

        localStorage.setItem('wingo_dynamic_v1', JSON.stringify(history));
    }

    function addResult(num) {
        const item = getItem Details ? getItemDetails(num) : null;
        if(item) {
            history.push(item);
            updateUI();
        }
    }

    function clearData() {
        history = [];
        localStorage.removeItem('wingo_dynamic_v1');
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
